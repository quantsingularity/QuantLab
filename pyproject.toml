[project]
name = "quantlab"
version = "0.1.0"
description = "An agentic AI framework for end-to-end quantitative research and alpha discovery."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "QuantLab Author" }]
license = "MIT"

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "yfinance>=0.2.40",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "langgraph>=0.2.0",
    "openai>=1.40.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "reportlab>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0",
]
postgres = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
    "coverage>=7.5",
]

[project.scripts]
quantlab = "quantlab.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001 (no bare "except Exception") is silenced only at the specific
# boundaries in this codebase that are meant to catch anything: an
# unreachable data provider, an unreachable Postgres instance, or a
# corrupt chart image embedded in the PDF report. Each of those sites
# degrades gracefully to a documented fallback rather than crashing the
# pipeline, which is the point of catching broadly there.
# TRY004 (prefer TypeError for a wrong-type value) is silenced because
# quantlab.core.llm.parse_json_response deliberately raises ValueError for
# every kind of "the LLM did not return usable JSON" failure, matching
# json.JSONDecodeError's own ValueError base, so every caller can catch a
# single exception type instead of two for closely related failure modes.
ignore = ["BLE001", "TRY004"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
# Deliberately not `strict = true`: LangGraph's StateGraph.add_node overloads
# are parameterized on a TypedDict/BaseModel type argument that mypy cannot
# bind from a plain `Callable[[ResearchState], ResearchState]` closure, so
# --strict fights the library's stubs rather than catching real bugs in this
# project's code. The flags above still require every function to be
# annotated and still fail on genuinely unreachable code or stale ignores.
[[tool.mypy.overrides]]
module = "quantlab.core.graph"
disable_error_code = ["call-overload"]
